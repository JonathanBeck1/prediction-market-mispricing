# Manual priors for speakers that lack resolved Kalshi outcome history.
# This file is NEVER overwritten by calibrate_base_rates.py or compute_base_rates.py.
# Once a speaker accumulates N >= 8 resolved outcomes, base_rates_auto.yaml will
# override individual phrase entries automatically (it loads after this file).
#
# How to add a new speaker:
#   1. Add an entry below with context buckets (press_conference, general, etc.)
#   2. Set _context_base for the expected context type
#   3. Once 20+ transcripts are in data/corpus/<speaker>/ and outcomes start
#      resolving, the auto calibration will replace these priors.
#
# ─────────────────────────────────────────────────────────────────────────────
